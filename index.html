<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RND Miner</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Monetag/Ad Provider SDK -->
    <script src='//libtl.com/sdk.js' data-zone='8909384' data-sdk='show_8909384'></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                            dark: '#0b0f19',
                            card: '#151c2c',
                            accent: '#22c55e'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .pulse-glow {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }

        .mining-active-glow {
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.4);
        }

        .glass-card {
            background: rgba(21, 28, 44, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 4px;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between pb-20 select-none">

    <!-- Top App Bar -->
    <header class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center font-bold text-lg shadow-lg">
                <i class="fa-solid font-mono text-white">R</i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-wide text-white leading-tight">RND MINER</h1>
                <p id="user-display-name" class="text-xs text-gray-400">Guest User</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="auth-btn" onclick="openAuthModal()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-xs font-semibold rounded-lg transition-all flex items-center space-x-1">
                <i class="fa-solid fa-user text-xs"></i>
                <span id="auth-btn-text">Login</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container max-w-md mx-auto px-4 pt-4 flex-1 flex flex-col justify-start space-y-4">

        <!-- Balance Card -->
        <section class="glass-card rounded-2xl p-5 text-center relative overflow-hidden pulse-glow">
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-brand-500/10 rounded-full blur-2xl"></div>
            <p class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Total Mined Balance</p>
            <div class="flex items-center justify-center space-x-2 my-1">
                <i class="fa-solid fa-coins text-amber-400 text-2xl"></i>
                <span id="balance-display" class="font-mono text-3xl font-extrabold text-white tracking-tight">0.000000</span>
                <span class="text-xs font-semibold text-brand-400 self-end mb-1">RND</span>
            </div>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800/80 text-xs text-gray-400">
                <span>Hashrate: <strong id="hashrate-display" class="text-gray-200 font-mono">1.00 H/s</strong></span>
                <span>Status: <strong id="mining-status-text" class="text-amber-400">Idle</strong></span>
            </div>
        </section>

        <!-- Mining Engine Console -->
        <section class="glass-card rounded-2xl p-5 text-center flex flex-col items-center justify-center relative">
            <div id="mining-ring" class="w-36 h-36 rounded-full border-4 border-dashed border-gray-700 flex items-center justify-center relative my-2 transition-all duration-500">
                <div class="text-center">
                    <i id="mining-icon" class="fa-solid fa-microchip text-4xl text-gray-500 mb-1 transition-colors"></i>
                    <p id="timer-display" class="font-mono text-sm font-bold text-gray-300">00:00:00</p>
                </div>
            </div>

            <button id="start-mining-btn" onclick="toggleMiningSession()" class="w-full mt-4 py-3.5 px-6 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 active:scale-95 text-white font-bold text-sm rounded-xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play"></i>
                <span>START MINING SESSION</span>
            </button>
        </section>

        <!-- Quick Actions & Boosters -->
        <section class="grid grid-cols-2 gap-3">
            <button onclick="triggerAdBoost()" class="glass-card p-3.5 rounded-xl flex items-center space-x-3 hover:bg-gray-800/50 transition text-left group">
                <div class="w-10 h-10 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white">5.7x Boost</h3>
                    <p class="text-[10px] text-gray-400">Watch short ad</p>
                </div>
            </button>

            <button onclick="claimDailyReward()" class="glass-card p-3.5 rounded-xl flex items-center space-x-3 hover:bg-gray-800/50 transition text-left group">
                <div class="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white">Daily Bonus</h3>
                    <p class="text-[10px] text-gray-400">Free daily RND</p>
                </div>
            </button>
        </section>

        <!-- Navigation Tabs -->
        <div class="glass-card p-1 rounded-xl flex text-xs font-semibold text-gray-400">
            <button id="tab-btn-withdraw" onclick="switchTab('withdraw')" class="flex-1 py-2 rounded-lg text-center bg-brand-600 text-white transition">Withdraw</button>
            <button id="tab-btn-history" onclick="switchTab('history')" class="flex-1 py-2 rounded-lg text-center hover:text-white transition">History</button>
        </div>

        <!-- Withdraw Panel -->
        <section id="panel-withdraw" class="glass-card rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold uppercase text-gray-300 tracking-wider">Request Payout</h3>
            
            <div>
                <label class="text-[11px] text-gray-400 block mb-1">Payment Method</label>
                <select id="withdraw-method" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                    <option value="Binance UID">Binance Pay (UID)</option>
                    <option value="EasyPaisa">EasyPaisa (PKR Account)</option>
                    <option value="USDT TRC20">USDT (TRC20 Address)</option>
                </select>
            </div>

            <div>
                <label class="text-[11px] text-gray-400 block mb-1">Account ID / Address / Number</label>
                <input id="withdraw-account" type="text" placeholder="Enter details..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500 font-mono">
            </div>

            <div>
                <label class="text-[11px] text-gray-400 block mb-1">Amount (Min: 50 RND)</label>
                <input id="withdraw-amount" type="number" placeholder="50.0" min="50" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500 font-mono">
            </div>

            <button onclick="submitWithdrawal()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition-all shadow-md">
                Submit Request
            </button>
        </section>

        <!-- History Panel -->
        <section id="panel-history" class="glass-card rounded-2xl p-4 hidden space-y-2 max-h-60 overflow-y-auto">
            <h3 class="text-xs font-bold uppercase text-gray-300 tracking-wider mb-2">Recent Transactions</h3>
            <div id="history-list" class="text-xs text-gray-400 text-center py-4">
                No transactions recorded yet.
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-[11px] text-gray-500">
        RND Network Engine &copy; 2026. All rights reserved.
    </footer>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 space-y-4 border border-gray-700 relative">
            <button onclick="closeAuthModal()" class="absolute right-4 top-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h2 class="text-lg font-bold text-white text-center">Account Access</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Email Address</label>
                    <input id="auth-email" type="email" placeholder="user@example.com" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Password</label>
                    <input id="auth-password" type="password" placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                </div>
            </div>

            <div class="flex space-x-2 pt-2">
                <button onclick="handleEmailAuth('login')" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs rounded-lg transition">Sign In</button>
                <button onclick="handleEmailAuth('signup')" class="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-bold text-xs rounded-lg transition">Register</button>
            </div>
            
            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="flex-shrink mx-2 text-[10px] text-gray-500 uppercase">Or</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <button onclick="handleGoogleAuth()" class="w-full py-2.5 bg-white text-gray-900 font-bold text-xs rounded-lg hover:bg-gray-100 transition flex items-center justify-center space-x-2">
                <i class="fa-brands fa-google text-sm"></i>
                <span>Continue with Google</span>
            </button>
        </div>
    </div>

    <!-- Firebase SDK Modular Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            onSnapshot, 
            collection, 
            addDoc, 
            query, 
            where, 
            orderBy, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Web App's Firebase Configuration
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App State
        const SESSION_DURATION_MS = 3 * 60 * 60 * 1000; // 3 Hours
        const BASE_HASHRATE = 0.0001; // RND per sec

        let currentUser = null;
        let unsubscribeUserDoc = null;
        let localTicker = null;

        let userData = {
            balance: 0.0,
            miningActive: false,
            miningStartTime: null,
            boostUntil: 0,
            lastClaimDate: null,
            withdrawals: []
        };

        // Telegram WebApp Initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Auth Observer
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const authBtnText = document.getElementById('auth-btn-text');
            const userDisplay = document.getElementById('user-display-name');

            if (user) {
                authBtnText.innerText = "Logout";
                userDisplay.innerText = user.displayName || user.email.split('@')[0];
                listenToUserData(user.uid);
            } else {
                authBtnText.innerText = "Login";
                userDisplay.innerText = "Guest User";
                if (unsubscribeUserDoc) unsubscribeUserDoc();
                resetLocalState();
            }
        });

        // Firestore Realtime Listener
        function listenToUserData(uid) {
            const userRef = doc(db, "users", uid);
            unsubscribeUserDoc = onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    userData.balance = data.balance || 0;
                    userData.miningActive = data.miningActive || false;
                    userData.miningStartTime = data.miningStartTime || null;
                    userData.boostUntil = data.boostUntil || 0;
                    userData.lastClaimDate = data.lastClaimDate || null;
                    updateUI();
                } else {
                    // Initialize New User Document
                    setDoc(userRef, {
                        balance: 0.0,
                        miningActive: false,
                        miningStartTime: null,
                        boostUntil: 0,
                        createdAt: Date.now()
                    });
                }
            });
            fetchHistory(uid);
        }

        // Live Reward & State Computation
        function computeCurrentState() {
            const now = Date.now();
            let liveBalance = userData.balance;
            let currentHashrate = BASE_HASHRATE;
            let isMining = userData.miningActive;
            let remainingMs = 0;

            if (now < userData.boostUntil) {
                currentHashrate *= 5.7; // Boost multiplier
            }

            if (isMining && userData.miningStartTime) {
                const elapsedMs = now - userData.miningStartTime;
                
                if (elapsedMs >= SESSION_DURATION_MS) {
                    // Mining Session Finished
                    const totalSessionSeconds = SESSION_DURATION_MS / 1000;
                    liveBalance += (totalSessionSeconds * BASE_HASHRATE);
                    isMining = false;
                    remainingMs = 0;

                    // Automatically sync completed state to backend
                    if (currentUser) {
                        updateDoc(doc(db, "users", currentUser.uid), {
                            balance: liveBalance,
                            miningActive: false,
                            miningStartTime: null
                        });
                    }
                } else {
                    // Mining active
                    const elapsedSeconds = elapsedMs / 1000;
                    liveBalance += (elapsedSeconds * currentHashrate);
                    remainingMs = SESSION_DURATION_MS - elapsedMs;
                }
            }

            return { liveBalance, currentHashrate, isMining, remainingMs };
        }

        // UI Refresh Loop
        function updateUI() {
            const state = computeCurrentState();

            // Render Balance & Hashrate
            document.getElementById('balance-display').innerText = state.liveBalance.toFixed(6);
            document.getElementById('hashrate-display').innerText = state.currentHashrate.toFixed(4) + " H/s";

            // Render Mining Visuals
            const statusText = document.getElementById('mining-status-text');
            const ring = document.getElementById('mining-ring');
            const icon = document.getElementById('mining-icon');
            const timer = document.getElementById('timer-display');
            const startBtn = document.getElementById('start-mining-btn');

            if (state.isMining) {
                statusText.innerText = "Active";
                statusText.className = "text-emerald-400 font-bold";
                ring.className = "w-36 h-36 rounded-full border-4 border-emerald-500 flex items-center justify-center relative my-2 mining-active-glow transition-all duration-500";
                icon.className = "fa-solid fa-microchip text-4xl text-emerald-400 mb-1 animate-pulse";
                
                // Format HH:MM:SS
                const secondsTotal = Math.floor(state.remainingMs / 1000);
                const hrs = String(Math.floor(secondsTotal / 3600)).padStart(2, '0');
                const mins = String(Math.floor((secondsTotal % 3600) / 60)).padStart(2, '0');
                const secs = String(secondsTotal % 60).padStart(2, '0');
                timer.innerText = `${hrs}:${mins}:${secs}`;

                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                startBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>MINING IN PROGRESS</span>`;
            } else {
                statusText.innerText = "Idle";
                statusText.className = "text-amber-400 font-bold";
                ring.className = "w-36 h-36 rounded-full border-4 border-dashed border-gray-700 flex items-center justify-center relative my-2 transition-all duration-500";
                icon.className = "fa-solid fa-microchip text-4xl text-gray-500 mb-1";
                timer.innerText = "00:00:00";

                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                startBtn.innerHTML = `<i class="fa-solid fa-play"></i><span>START MINING SESSION</span>`;
            }
        }

        // Ticker for UI
        if (!localTicker) {
            localTicker = setInterval(updateUI, 1000);
        }

        // Global Actions
        window.toggleMiningSession = async function() {
            if (!currentUser) return openAuthModal();

            const state = computeCurrentState();
            if (state.isMining) return;

            const now = Date.now();
            await updateDoc(doc(db, "users", currentUser.uid), {
                miningActive: true,
                miningStartTime: now
            });
            
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        };

        window.triggerAdBoost = function() {
            if (typeof show_8909384 === 'function') {
                show_8909384().then(async () => {
                    if (currentUser) {
                        const boostExpiry = Date.now() + (1 * 60 * 60 * 1000); // 1 Hour boost
                        await updateDoc(doc(db, "users", currentUser.uid), {
                            boostUntil: boostExpiry
                        });
                        alert("5.7x Hashrate Boost Activated for 1 Hour!");
                    }
                }).catch(() => {
                    alert("Ad failed to load. Please try again later.");
                });
            } else {
                alert("Ad provider initializing. Please tap again in a moment.");
            }
        };

        window.claimDailyReward = async function() {
            if (!currentUser) return openAuthModal();

            const today = new Date().toISOString().split('T')[0];
            if (userData.lastClaimDate === today) {
                return alert("Daily reward already claimed today. Come back tomorrow!");
            }

            const state = computeCurrentState();
            const rewardAmount = 2.50; // 2.50 RND Bonus
            const newBalance = state.liveBalance + rewardAmount;

            await updateDoc(doc(db, "users", currentUser.uid), {
                balance: newBalance,
                lastClaimDate: today
            });

            alert(`Successfully claimed ${rewardAmount} RND daily reward!`);
        };

        window.submitWithdrawal = async function() {
            if (!currentUser) return openAuthModal();

            const method = document.getElementById('withdraw-method').value;
            const account = document.getElementById('withdraw-account').value.trim();
            const amount = parseFloat(document.getElementById('withdraw-amount').value);

            const state = computeCurrentState();

            if (!account) return alert("Please enter your account details.");
            if (isNaN(amount) || amount < 50) return alert("Minimum withdrawal amount is 50 RND.");
            if (amount > state.liveBalance) return alert("Insufficient balance.");

            // Deduct locally and submit request
            const remainingBalance = state.liveBalance - amount;

            await updateDoc(doc(db, "users", currentUser.uid), {
                balance: remainingBalance
            });

            await addDoc(collection(db, "withdrawals"), {
                uid: currentUser.uid,
                method: method,
                account: account,
                amount: amount,
                status: "Pending",
                timestamp: Date.now()
            });

            alert("Withdrawal request submitted successfully!");
            document.getElementById('withdraw-account').value = "";
            document.getElementById('withdraw-amount').value = "";
            fetchHistory(currentUser.uid);
        };

        async function fetchHistory(uid) {
            const q = query(
                collection(db, "withdrawals"), 
                where("uid", "==", uid),
                orderBy("timestamp", "desc")
            );
            
            try {
                const querySnapshot = await getDocs(q);
                const historyList = document.getElementById('history-list');
                
                if (querySnapshot.empty) {
                    historyList.innerHTML = `<p class="text-xs text-gray-500 py-2">No withdrawal history found.</p>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = new Date(data.timestamp).toLocaleDateString();
                    html += `
                        <div class="flex justify-between items-center py-2 border-b border-gray-800 text-left">
                            <div>
                                <p class="text-xs font-bold text-white">${data.method}</p>
                                <p class="text-[10px] text-gray-400">${date} - ${data.account}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-mono font-bold text-white">-${data.amount} RND</p>
                                <span class="text-[10px] px-1.5 py-0.5 rounded ${data.status === 'Pending' ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400'}">${data.status}</span>
                            </div>
                        </div>
                    `;
                });
                historyList.innerHTML = html;
            } catch (err) {
                console.error("History fetch error: ", err);
            }
        }

        // Navigation Tabs
        window.switchTab = function(tab) {
            const withdrawPanel = document.getElementById('panel-withdraw');
            const historyPanel = document.getElementById('panel-history');
            const withdrawBtn = document.getElementById('tab-btn-withdraw');
            const historyBtn = document.getElementById('tab-btn-history');

            if (tab === 'withdraw') {
                withdrawPanel.classList.remove('hidden');
                historyPanel.classList.add('hidden');
                withdrawBtn.className = "flex-1 py-2 rounded-lg text-center bg-brand-600 text-white transition";
                historyBtn.className = "flex-1 py-2 rounded-lg text-center hover:text-white transition";
            } else {
                withdrawPanel.classList.add('hidden');
                historyPanel.classList.remove('hidden');
                historyBtn.className = "flex-1 py-2 rounded-lg text-center bg-brand-600 text-white transition";
                withdrawBtn.className = "flex-1 py-2 rounded-lg text-center hover:text-white transition";
            }
        };

        // Modal Handlers
        window.openAuthModal = function() {
            if (currentUser) {
                signOut(auth);
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        };

        window.closeAuthModal = function() {
            document.getElementById('auth-modal').classList.add('hidden');
        };

        window.handleEmailAuth = async function(type) {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) return alert("Please fill in both fields.");

            try {
                if (type === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                closeAuthModal();
            } catch (err) {
                alert(err.message);
            }
        };

        window.handleGoogleAuth = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                closeAuthModal();
            } catch (err) {
                alert(err.message);
            }
        };

        function resetLocalState() {
            userData = {
                balance: 0.0,
                miningActive: false,
                miningStartTime: null,
                boostUntil: 0,
                lastClaimDate: null,
                withdrawals: []
            };
            updateUI();
        }
    </script>
</body>
</html>
